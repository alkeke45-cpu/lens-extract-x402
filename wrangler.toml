name = "lens-extract-x402"
main = "worker.js"
compatibility_date = "2026-11-04"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# Kinetic Dune /ask (AIBTC bounty mwc3szq53cae05deebce): Workers AI binding
# used by the paid answer engine when available (keyless fallback otherwise).
[ai]
binding = "AI"

[vars]
AGENT_PROMPT = "You are Kinetic Dune, a precise tutor for Bitcoin and Stacks. Explain concepts, Clarity smart-contract code, and transaction mechanics in plain language, flag risks and common mistakes, and keep answers clear and concise."
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
PRICE = "10"
TOKEN = "sBTC"
STACKS_NETWORK = "mainnet"
PAY_TO = "SP2DG4JE87V54X7JRJB5M99XM03Y1BJDDQ42C1GS4"
MAX_SATS_PER_PAYMENT = "1000"
# POST /v1/relay auth (Phase 13): SHA-256 hex of the relay token ONLY.
# The plaintext token is never committed (public repo); it lives solely in
# the operator's local 600-mode cf-relay-secret.env.
RELAY_AUTH_SHA256 = "60709accc12807ab7a945ac1e9c2f7d39ba6d30020542a22dd28f51765fc9b53"

# RegionalRelay Durable Object (Phase 16): /v1/relay routes fetch specs
# through a DO obtained with a locationHint when a region is requested.
# SQLite-backed class (free-tier compatible). The hint guides object
# placement only; it does not guarantee the fetch's egress region, and
# worker.js falls back to a direct fetch on any DO error.
[[durable_objects.bindings]]
name = "REGIONAL_RELAY"
class_name = "RegionalRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RegionalRelay"]
